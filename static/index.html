dding:12px 15px;border-bottom:1px solid var(--line);flex-wrap:wrap}.tab-btn{border:1px solid transparent;background:transparent;color:var(--muted);padding:8px 11px;border-radius:5px;font-size:11px}.tab-btn.active{color:var(--mint);background:#243129;border-color:#33453a}.form-footer{padding:0 16px 16px;display:flex;justify-content:flex-end}.tracking-search{display:flex;gap:8px;max-width:550px;width:100%}.track-layout{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:14px}.passport-head{padding:16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.passport-info{display:flex;align-items:center;gap:12px}.product-glyph{width:40px;height:40px;border-radius:7px;background:#29382e;display:grid;place-items:center;color:var(--mint)}.passport-title{font-size:14px;font-weight:700}.passport-meta{font-size:10px;color:var(--muted);margin-top:4px}.timeline{padding:18px 20px 20px}.event{display:grid;grid-template-columns:24px 1fr;gap:12px;position:relative;padding-bottom:19px}.event:not(:last-child):before{content:'';position:absolute;width:1px;background:#425348;top:18px;bottom:0;left:8px}.event-marker{width:17px;height:17px;border:1px solid var(--mint);background:#203128;border-radius:50%;z-index:1;display:grid;place-items:center;color:var(--mint)}.event-body{border:1px solid var(--line);background:#1a221e;border-radius:6px;padding:12px}.event-head{display:flex;justify-content:space-between;gap:12px}.event-title{font-size:11px;font-weight:700}.event-time{font-family:'DM Mono',monospace;font-size:9px;color:var(--muted)}.event-location{margin-top:5px;color:#b2c0b6;font-size:10px}.event-meta{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px 12px;margin-top:11px;padding-top:10px;border-top:1px solid #2b352f}.meta-item{font-size:9px;color:var(--muted)}.meta-item strong{display:block;color:#d3ded5;font-size:10px;font-weight:500;margin-top:3px}.mini-scene{height:180px;background:radial-gradient(ellipse,#344338,#1a211d 72%);position:relative}.mini-scene canvas{width:100%;height:100%;display:block}.mini-label{position:absolute;top:11px;left:12px;font-size:9px;color:#aebbb2}.empty{padding:35px 20px;text-align:center;color:var(--muted);font-size:11px}.mdm-nav{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:13px}.mdm-actions{display:flex;gap:8px;align-items:center}.search-small{width:230px}.toast{position:fixed;right:23px;bottom:22px;z-index:100;background:#e4f0e7;color:#152019;border-radius:6px;padding:12px 15px;box-shadow:0 10px 35px #0008;font-size:12px;max-width:380px;animation:toastIn .22s ease-out}.toast.error{background:#f0d7d0;color:#321b16}@keyframes toastIn{from{transform:translateY(8px);opacity:0}to{transform:translateY(0);opacity:1}}@keyframes arrive{from{transform:translateY(5px);opacity:0}to{transform:translateY(0);opacity:1}}.modal-backdrop{position:fixed;inset:0;background:#070a08b8;z-index:30;display:grid;place-items:center;padding:20px}.modal{width:min(560px,100%);background:var(--panel);border:1px solid #3a473f;border-radius:8px;box-shadow:0 25px 80px #0009}.modal-head{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.modal-body{padding:16px}.modal-footer{padding:12px 16px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}.hidden{display:none!important}.loading{min-height:60vh;display:grid;place-items:center;color:var(--muted)}

<body>
  <div class="app">
    <aside class="sidebar">
      <a class="brand" href="#" aria-label="Низоми таъминот">
        <span class="brand-mark"><i data-lucide="scan-line" width="19"></i></span>
        <span><span class="brand-name">занҷир<span style="color:var(--mint)">&</span>пайгирӣ</span><span class="brand-sub" style="display:block">НИЗОМИ ТАЪМИНОТ</span></span>
      </a>
      <div class="nav-label">Фазои корӣ</div>
      <nav class="nav" aria-label="Паймоиши асосӣ">
        <button class="nav-btn active" data-view="dashboard"><i data-lucide="layout-dashboard" width="17"></i><span>Студияи маҳсулот</span></button>
        <button class="nav-btn" data-view="logistics"><i data-lucide="truck" width="17"></i><span>Ҳаракати бор</span></button>
        <button class="nav-btn" data-view="tracking"><i data-lucide="route" width="17"></i><span>Пайгирӣ</span></button>
        <button class="nav-btn" data-view="mdm"><i data-lucide="library-big" width="17"></i><span>Маълумотномаҳо</span></button>
      </nav>
      <div class="sidebar-bottom"><span class="live-dot"></span><span>Феҳрист ҳамоҳанг аст</span></div>
    </aside>
    <div class="workspace">
      <header class="topbar"><div class="crumb">Занҷири таъминот <span style="color:#546158;margin:0 7px">/</span> <strong id="crumb-title">Студияи маҳсулот</strong></div><div class="top-actions"><span class="date-tag mono" id="today"></span><div class="user-chip"><span class="avatar">ЗН</span><span class="user-label">Зебо Нурова</span></div></div></header>
      <main class="content" id="app-content"><div class="loading">Феҳрист ва маълумотномаҳо бор мешаванд…</div></main>
    </div>
  </div>
  <div id="modal-root"></div>
  <div id="toast-root" aria-live="polite"></div>
  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js';
    import { OrbitControls } from 'https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/controls/OrbitControls.js';

    const API='/api';
    const resourceNames={locations:'Ҷойҳо',staff:'Кормандон',vehicles:'Нақлиёт',routes:'Масирҳо'};
    const resourceFields={
      locations:[['name','Номи ҷой'],['kind','Навъ'],['region','Минтақа'],['address','Суроға'],['city','Шаҳр']],
      staff:[['name','Ному насаб'],['role','Вазифа'],['employee_no','Рақами корманд'],['phone','Телефон']],
      vehicles:[['plate','Рақами мошин'],['brand','Тамға'],['driver','Ронанда'],['driver_phone','Телефони ронанда'],['capacity','Ғунҷоиш, т'],['refrigerated','Яхдон']],
      routes:[['name','Номи масир'],['origin','Аз куҷо'],['destination','Ба куҷо'],['distance_km','Масофа, км'],['duration_hours','Вақт, соат']]
    };
    const stageNames={factory:'Корхона',workshop:'Сех ва назорати дохилӣ',warehouse:'Анбор ва феҳрист',transport:'Нақлиёт'};
    const locationKinds={factory:'Корхона',warehouse:'Анбор',pickup:'Нуқтаи қабул'};
    const stageOrder=['factory','workshop','warehouse','transport'];
    const tajikMonths=['январ','феврал','март','апрел','май','июн','июл','август','сентябр','октябр','ноябр','декабр'];
    if(!Intl.DateTimeFormat.supportedLocalesOf('tg-TJ').length){
      const nativeDateToLocaleString=Date.prototype.toLocaleString;
      Date.prototype.toLocaleString=function(locale,options){
        if(locale==='tg-TJ'){
          const date=this;
          const day=date.getDate();
          const month=tajikMonths[date.getMonth()];
          const year=date.getFullYear();
          if(options?.timeStyle){
            const hour=String(date.getHours()).padStart(2,'0');
            const minute=String(date.getMinutes()).padStart(2,'0');
            return `${day} ${month} ${year}, ${hour}:${minute}`;
          }
          return `${day} ${month} ${year}`;
        }
        return nativeDateToLocaleString.call(this,locale,options);
      };
    }
    const state={data:null,view:'dashboard',mdm:'locations',logisticsStage:'workshop',trackBarcode:'',selectedBarcode:'',scene:null,miniScene:null,config:{type:'marker',color:'#729c82',capColor:'#d2a35e',length:12,diameter:1.8,shape:'faceted'}};
    const $=(selector,root=document)=>root.querySelector(selector);
    const esc=value=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
    const api=async(path,options={})=>{const response=await fetch(`${API}${path}`,{...options,headers:{'Content-Type':'application/json',...(options.headers||{})}});const body=await response.json().catch(()=>({}));if(!response.ok)throw new Error(body.detail||'Амалиёт иҷро нашуд');return body;};
    const toast=(message,error=false)=>{const root=$('#toast-root');root.innerHTML=`<div class="toast ${error?'error':''}">${esc(message)}</div>`;setTimeout(()=>{root.innerHTML='';},3600);};
    const icon=(name,size=15)=>`<i data-lucide="${name}" width="${size}" height="${size}"></i>`;
    const refreshIcons=()=>window.lucide?.createIcons();
    const options=(items,key='id',label=item=>item.name)=>items.map(item=>`<option value="${esc(item[key])}">${esc(label(item))}</option>`).join('');
    const locationsOf=kind=>(state.data?.locations||[]).filter(item=>item.kind===kind);
    const staffOf=role=>(state.data?.staff||[]).filter(item=>item.role===role);
    const stageName=stage=>stageNames[stage]||stage;
    const locationLabel=item=>`${item.name} · ${item.city}`;

    function shell(title,subtitle,eyebrow,body){
      $('#crumb-title').textContent=title;
      $('#app-content').innerHTML=`<div class="page-head"><div><div class="eyebrow">${eyebrow}</div><h1>${title}</h1><p>${subtitle}</p></div></div>${body}`;
      refreshIcons();
    }
    function barcode(){const base=`485${Date.now().toString().slice(-9)}`;const sum=[...base].reduce((total,digit,index)=>total+Number(digit)*(index%2?3:1),0);return `${base}${(10-sum%10)%10}`;}
    function dashboard(){
      const products=state.data.products;
      const atTransport=products.filter(item=>item.current_stage==='transport').length;
      const audited=products.filter(item=>item.current_stage==='warehouse'||item.current_stage==='transport').length;
      const pending=products.filter(item=>item.qc_status.toLowerCase().includes('интизор')).length;
      shell('Студияи маҳсулот','Маркерро тарҳрезӣ кунед, андоза ва рангро интихоб намоед ва барориши корхонаро сабт кунед.','МАҲСУЛОТ · БАРОРИШИ КОРХОНА',`
        <div class="stats">
          <div class="stat"><div class="stat-label">Маҳсулот дар феҳрист</div><div class="stat-value">${products.length}</div><div class="stat-note">Ҳар баста пайгирӣ мешавад</div></div>
          <div class="stat"><div class="stat-label">Дар роҳ</div><div class="stat-value">${atTransport}</div><div class="stat-note">Мошинҳои фаъол</div></div>
          <div class="stat"><div class="stat-label">Марҳилаҳои анбор ва роҳ</div><div class="stat-value">${audited}</div><div class="stat-note">Бо занҷири аудит</div></div>
          <div class="stat"><div class="stat-label">Назорати сифат</div><div class="stat-value">${pending}</div><div class="stat-note">Интизори санҷиш</div></div>
        </div>
        <div class="studio-grid">
          <section class="panel"><div class="panel-head"><div><div class="panel-title">Конструктори маркер</div><div class="panel-kicker">Намуна бо ҳар тағйири танзим нав мешавад</div></div><span class="scene-badge">3D · НАМУНА</span></div>
            <div class="scene-wrap" id="scene-main"><div class="scene-label"><span class="live-dot"></span>НАМОИШИ МАҲСУЛОТ <span class="scene-badge">МАРКЕР</span></div><div class="scene-help">Барои гардондан кашед · чарх барои наздиккунӣ</div></div>
            <div class="scene-controls"><div class="seg" id="shape-control"><button data-shape="round">Даврашакл</button><button data-shape="faceted" class="active">Фасетдор</button></div><span class="control-note">Намуди корпус</span></div>
          </section>
          <section class="panel"><div class="panel-head"><div><div class="panel-title">Андоза ва ранг</div><div class="panel-kicker">Танзимот дар шиносномаи рақамӣ нигоҳ дошта мешавад</div></div>${icon('sliders-horizontal')}</div>
            <div class="form-grid">
              <div class="field"><label for="body-color">Ранги корпус</label><div class="inline-input"><input class="input" id="body-color" type="color" value="${state.config.color}"><div class="presets"><button class="swatch" title="Сурх" aria-label="Сурх" style="background:#d66e62" data-color="#d66e62"></button><button class="swatch" title="Кабуд" aria-label="Кабуд" style="background:#6e9eb5" data-color="#6e9eb5"></button><button class="swatch" title="Сабз" aria-label="Сабз" style="background:#78a88a" data-color="#78a88a"></button><button class="swatch" title="Сиёҳ" aria-label="Сиёҳ" style="background:#303734" data-color="#303734"></button><button class="swatch" title="Зард" aria-label="Зард" style="background:#d5a74e" data-color="#d5a74e"></button></div></div></div>
              <div class="field"><label for="cap-color">Ранги сарпӯш</label><input class="input" id="cap-color" type="color" value="${state.config.capColor}"></div>
              <div class="field full"><label>Дарозӣ</label><div class="range-row"><input id="product-length" type="range" min="8" max="16" step="0.5" value="${state.config.length}"><span class="range-value" id="length-value">${state.config.length} см</span></div></div>
              <div class="field full"><label>Ғафсӣ</label><div class="range-row"><input id="product-diameter" type="range" min="1.2" max="2.8" step="0.1" value="${state.config.diameter}"><span class="range-value" id="diameter-value">${state.config.diameter} мм</span></div></div>
            </div>
          </section>
        </div>
        <div class="release-head"><h2>Сабти барориши корхона</h2><span>Марҳилаи аввали таърихи маҳсулот худкор сабт мешавад</span></div>
        <form class="panel" id="release-form"><div class="form-grid">
          <div class="field"><label for="release-name">Номи маҳсулот</label><input class="input" id="release-name" required value="Маркер «Помир»"></div>
          <div class="field"><label for="release-batch">Рақами баста</label><input class="input mono" id="release-batch" required value="TJ-26-105"></div>
          <div class="field"><label for="release-barcode">Рақами штрихкод</label><div class="inline-input"><input class="input mono" id="release-barcode" required value="${barcode()}"><button type="button" class="btn icon-btn" id="generate-barcode" title="Рақами нав созед" aria-label="Рақами нав созед">${icon('refresh-cw',14)}</button></div></div>
          <div class="field"><label for="release-factory">Корхонаи истеҳсолкунанда</label><select class="select" id="release-factory" required>${options(locationsOf('factory'),'id',item=>item.name)}</select></div>
          <div class="field"><label for="release-responsible">Масъули сех</label><select class="select" id="release-responsible" required>${options(state.data.staff.filter(item=>['Роҳбари корхона','Устои сех'].includes(item.role)))}</select></div>
          <div class="field"><label for="release-operator">Оператори низом</label><select class="select" id="release-operator" required>${options(state.data.staff)}</select></div>
          <div class="field"><label for="release-weight">Вазни баста, кг</label><input class="input" id="release-weight" type="number" min="0.01" step="0.01" value="8.5" required></div>
          <div class="field"><label for="release-quality">Ҳолати санҷиши сифат</label><select class="select" id="release-quality"><option>Санҷида шуд</option><option>Интизори санҷиш</option></select></div>
          <div class="field full"><label for="release-note">Эзоҳ</label><textarea class="textarea" id="release-note" placeholder="Натиҷаи санҷиш, рақами навбат..."></textarea></div>
          <div class="form-actions"><span class="hint">Рақами штрихкод бояд нав бошад. Танзими 3D дар шиносномаи рақамӣ мемонад.</span><button class="btn btn-primary" type="submit">${icon('factory',15)} Баровардан аз корхона</button></div>
        </div></form>
        <section class="panel section-gap"><div class="panel-head"><div><div class="panel-title">Маҳсулоти охирин</div><div class="panel-kicker">Барои дидани шиносномаи рақамӣ номи маҳсулотро интихоб кунед</div></div><button class="btn btn-quiet" data-goto="tracking">Ҳамаи маҳсулот ${icon('arrow-up-right',13)}</button></div>
          <div class="table-wrap"><table><thead><tr><th>МАҲСУЛОТ</th><th>ШТРИХКОД</th><th>БАСТА</th><th>МАРҲИЛА</th><th>СИФАТ</th></tr></thead><tbody>${products.slice(0,5).map(product=>`<tr><td><button class="product-link" data-track="${esc(product.barcode)}">${esc(product.name)}</button></td><td class="mono-id">${esc(product.barcode)}</td><td class="mono-id">${esc(product.batch_id)}</td><td><span class="status ${product.current_stage==='transport'?'warn':''}">${esc(stageName(product.current_stage))}</span></td><td>${esc(product.qc_status)}</td></tr>`).join('')}</tbody></table></div>
        </section>`);
      bindStudio();initScene($('#scene-main'),state.config,'main');
      $('#release-operator').value=state.data.staff.find(item=>item.role==='Оператори низом')?.id||state.data.staff[0]?.id;
    }
    function bindStudio(){
      $('#shape-control').addEventListener('click',event=>{const button=event.target.closest('[data-shape]');if(!button)return;state.config.shape=button.dataset.shape;$('#shape-control').querySelectorAll('button').forEach(item=>item.classList.toggle('active',item===button));updateScene(state.scene,state.config);});
      $('#body-color').addEventListener('input',event=>{state.config.color=event.target.value;updateScene(state.scene,state.config);});
      $('#cap-color').addEventListener('input',event=>{state.config.capColor=event.target.value;updateScene(state.scene,state.config);});
      document.querySelectorAll('[data-color]').forEach(button=>button.addEventListener('click',()=>{state.config.color=button.dataset.color;$('#body-color').value=state.config.color;updateScene(state.scene,state.config);}));
      $('#product-length').addEventListener('input',event=>{state.config.length=Number(event.target.value);$('#length-value').textContent=`${state.config.length} см`;updateScene(state.scene,state.config);});
      $('#product-diameter').addEventListener('input',event=>{state.config.diameter=Number(event.target.value);$('#diameter-value').textContent=`${state.config.diameter} мм`;updateScene(state.scene,state.config);});
      $('#generate-barcode').addEventListener('click',()=>{$('#release-barcode').value=barcode();});
      $('#release-form').addEventListener('submit',releaseProduct);
      $('#app-content').addEventListener('click',event=>{const track=event.target.closest('[data-track]');if(track)openTracking(track.dataset.track);const goto=event.target.closest('[data-goto]');if(goto)navigate(goto.dataset.goto);});
    }
    async function releaseProduct(event){
      event.preventDefault();
      try{await api('/products',{method:'POST',body:JSON.stringify({barcode:$('#release-barcode').value.trim(),batch_id:$('#release-batch').value.trim(),name:$('#release-name').value.trim(),config:state.config,weight:Number($('#release-weight').value),qc_status:$('#release-quality').value,note:$('#release-note').value.trim(),factory_id:Number($('#release-factory').value),responsible_id:Number($('#release-responsible').value),operator_id:Number($('#release-operator').value)})});await loadData();toast('Барориши маҳсулот дар феҳрист сабт шуд.');dashboard();}
      catch(error){toast(error.message,true);}
    }

    function logistics(){
      const stage=state.logisticsStage;
      const activeProducts=state.data.products.filter(item=>stageOrder.indexOf(item.current_stage)===stageOrder.indexOf(stage)-1);
      shell('Ҳаракати бор','Ҳар марҳила бо масъул, ҷой ва шароити қабули бор сабт мешавад. Гузаштан аз марҳила манъ аст.','ЗАНҶИРИ ҲАРАКАТИ МАҲСУЛОТ',`
        <section class="panel"><div class="panel-head"><div><div class="panel-title">Сабти марҳилаи нав</div><div class="panel-kicker">Ҳамаи рӯйдодҳои пешина дар феҳрист бетағйир мемонанд</div></div>${icon('git-branch')}</div>
          <div class="tabs"><button class="tab-btn ${stage==='workshop'?'active':''}" data-stage="workshop">01 · Сех</button><button class="tab-btn ${stage==='warehouse'?'active':''}" data-stage="warehouse">02 · Анбор</button><button class="tab-btn ${stage==='transport'?'active':''}" data-stage="transport">03 · Нақлиёт</button></div>
          <form id="event-form"><div class="form-grid">
            <div class="field full"><label for="event-product">Маҳсулот аз рӯи рақами штрихкод</label><select class="select" id="event-product" required>${options(activeProducts,'barcode',item=>`${item.barcode} · ${item.name}`)}</select>${activeProducts.length?'':'<span class="hint">Барои ин марҳила маҳсулоти мувофиқ нест.</span>'}</div>
            <div class="field"><label for="event-location">${stage==='workshop'?'Корхона / сех':stage==='warehouse'?'Анбор':'Ҷойи интиқол'}</label><select class="select" id="event-location" required>${options(stage==='workshop'?locationsOf('factory'):stage==='warehouse'?locationsOf('warehouse'):state.data.locations,'id',locationLabel)}</select></div>
            <div class="field"><label for="event-responsible">${stage==='workshop'?'Устои масъул':stage==='warehouse'?'Анбордор':'Масъули интиқол'}</label><select class="select" id="event-responsible" required>${options(stage==='workshop'?staffOf('Устои сех'):stage==='warehouse'?staffOf('Анбордор'):staffOf('Логист'))}</select></div>
            <div class="field"><label for="event-operator">${stage==='warehouse'?'Қабулкунандаи бор':'Оператори сабт'}</label><select class="select" id="event-operator" required>${options(stage==='warehouse'?staffOf('Қабулкунандаи бор'):state.data.staff)}</select></div>
            ${stage==='workshop'?workshopFields():stage==='warehouse'?warehouseFields():transportFields()}
            <div class="form-actions"><span class="hint">Корхона → Сех → Анбор → Нақлиёт</span><button class="btn btn-primary" type="submit" ${activeProducts.length?'':'disabled'}>${icon('arrow-right',14)} Сабти марҳила</button></div>
          </div></form>
        </section>
        <div class="split section-gap"><section class="panel"><div class="panel-head"><div><div class="panel-title">Ҳолати маҳсулот</div><div class="panel-kicker">Марҳилаи ҳозираи ҳар баста</div></div></div><div class="table-wrap"><table><thead><tr><th>МАҲСУЛОТ</th><th>МАРҲИЛА</th><th>БАСТА</th></tr></thead><tbody>${state.data.products.map(item=>`<tr><td><button class="product-link" data-track="${esc(item.barcode)}">${esc(item.name)}</button><div class="mono-id">${esc(item.barcode)}</div></td><td><span class="status ${item.current_stage==='transport'?'warn':''}">${esc(stageName(item.current_stage))}</span></td><td class="mono-id">${esc(item.batch_id)}</td></tr>`).join('')}</tbody></table></div></section>
        <section class="panel"><div class="panel-head"><div><div class="panel-title">Тартиби ҳатмии ҳаракат</div><div class="panel-kicker">Қоида дар сервер низ санҷида мешавад</div></div>${icon('shield-check')}</div><div style="padding:18px"><div class="mono" style="color:var(--mint);line-height:2;font-size:11px">КОРХОНА → СЕХ<br>СЕХ → АНБОР<br>АНБОР → НАҚЛИЁТ</div><p class="hint" style="margin-top:12px">Агар тартиб вайрон шавад, рӯйдод сабт намешавад ва таърихи қаблӣ нигоҳ дошта мешавад.</p></div></section></div>`);
      document.querySelectorAll('[data-stage]').forEach(button=>button.addEventListener('click',()=>{state.logisticsStage=button.dataset.stage;logistics();}));
      const selected=state.data.products.find(item=>item.barcode===state.selectedBarcode);if(selected&&activeProducts.some(item=>item.barcode===selected.barcode))$('#event-product').value=selected.barcode;
      const operator=state.data.staff.find(item=>item.role==='Оператори низом');if(operator&&$('#event-operator'))$('#event-operator').value=operator.id;
      $('#event-route')?.addEventListener('change',()=>{const route=state.data.routes.find(item=>item.id===Number($('#event-route').value));if(!route)return;$('#event-origin').value=route.origin;$('#event-destination').value=route.destination;$('#event-eta').value=route.duration_hours;});
      $('#event-route')?.dispatchEvent(new Event('change'));
      $('#event-form').addEventListener('submit',submitEvent);
      $('#app-content').addEventListener('click',event=>{const button=event.target.closest('[data-track]');if(button)openTracking(button.dataset.track);});
    }
    function workshopFields(){return `<div class="field"><label for="event-inspection">Натиҷаи санҷиши дохилӣ</label><select class="select" id="event-inspection"><option>Мувофиқи талабот</option><option>Бозбинӣ лозим аст</option></select></div><div class="field"><label for="event-line">Хати истеҳсол</label><input class="input" id="event-line" required value="Хати истеҳсолии 1"></div><div class="field full"><label for="event-adjustment">Эзоҳи усто</label><input class="input" id="event-adjustment" placeholder="Санҷиши сифат ва танзими маҳсулот"></div><div class="field full"><label for="event-revision">Тағйири ихтиёрии тарҳи ҷорӣ</label><select class="select" id="event-revision"><option value="no">Тағйири тарҳ нест</option><option value="yes">Танзими навро ҳамчун версия сабт кардан</option></select></div>`;}
    function warehouseFields(){return `<div class="field"><label for="event-shelf">Рақами раф</label><input class="input" id="event-shelf" required placeholder="A-12"></div><div class="field"><label for="event-sku">Рақами мол (SKU)</label><input class="input" id="event-sku" required placeholder="TJ-MRK-105"></div><div class="field"><label for="event-price">Нарх, сомонӣ</label><input class="input" id="event-price" type="number" min="0" value="20"></div><div class="field"><label for="event-temperature">Ҳарорати нигоҳдорӣ, °C</label><input class="input" id="event-temperature" type="number" value="21"></div><div class="field"><label for="event-package">Ҳолати баста</label><select class="select" id="event-package"><option>Солим</option><option>Осебдида</option></select></div>`;}
    function transportFields(){return `<div class="field"><label for="event-vehicle">Мошин ва ронанда</label><select class="select" id="event-vehicle" required>${options(state.data.vehicles,'id',item=>`${item.plate} · ${item.brand} · ${item.driver} · ${item.driver_phone}`)}</select></div><div class="field"><label for="event-route">Масир</label><select class="select" id="event-route" required>${options(state.data.routes,'id',item=>`${item.name} · ${item.distance_km} км`)}</select></div><div class="field"><label for="event-origin">Аз куҷо</label><input class="input" id="event-origin" required></div><div class="field"><label for="event-destination">Ба куҷо</label><input class="input" id="event-destination" required></div><div class="field"><label for="event-eta">Вақти тахминӣ, соат</label><input class="input" id="event-eta" type="number" min="1" required></div><div class="field"><label for="event-temperature">Ҳарорат дар яхдон, °C</label><input class="input" id="event-temperature" type="number" value="17"></div><div class="field"><label for="event-seal">Рақами муҳр</label><input class="input" id="event-seal" required placeholder="TJ-PL-105"></div><div class="field"><label for="event-cargo">Ҳолати бор</label><select class="select" id="event-cargo"><option>Бе осеб</option><option>Санҷиши иловагӣ лозим</option></select></div>`;}
    function eventMetadata(stage){
      if(stage==='workshop')return {inspection:$('#event-inspection').value,line:$('#event-line').value,adjustment:$('#event-adjustment').value};
      if(stage==='warehouse')return {shelf:$('#event-shelf').value,sku:$('#event-sku').value,price_tjs:Number($('#event-price').value),temperature_c:Number($('#event-temperature').value),package:$('#event-package').value};
      const vehicle=state.data.vehicles.find(item=>item.id===Number($('#event-vehicle').value));const route=state.data.routes.find(item=>item.id===Number($('#event-route').value));
      return {vehicle:vehicle.plate,brand:vehicle.brand,driver:vehicle.driver,driver_phone:vehicle.driver_phone,route:route.name,origin:$('#event-origin').value,destination:$('#event-destination').value,distance_km:route.distance_km,eta_hours:Number($('#event-eta').value),temperature_c:Number($('#event-temperature').value),seal:$('#event-seal').value,cargo_state:$('#event-cargo').value};
    }
    async function submitEvent(event){
      event.preventDefault();const stage=state.logisticsStage;const barcodeValue=$('#event-product').value;
      const payload={stage,location_id:Number($('#event-location').value),responsible_id:Number($('#event-responsible').value),operator_id:Number($('#event-operator').value),metadata:eventMetadata(stage)};
      if(stage==='workshop'&&$('#event-revision').value==='yes')payload.config_revision={...state.config};
      if(stage==='workshop'&&payload.config_revision)payload.revision_note=$('#event-adjustment').value||'Танзими нав дар сех';
      try{await api(`/products/${encodeURIComponent(barcodeValue)}/events`,{method:'POST',body:JSON.stringify(payload)});state.selectedBarcode=barcodeValue;await loadData();toast('Марҳилаи нав ба таърихи маҳсулот илова шуд.');logistics();}
      catch(error){toast(error.message,true);}
    }

    async function tracking(){
      let product=null;if(state.trackBarcode){try{product=await api(`/products/${encodeURIComponent(state.trackBarcode)}`);}catch{product=null;}}
      shell('Шиносномаи рақамӣ','Таърихи пурраи ҳаракат, масъулон ва танзими аслии 3D-и маҳсулот.','ПАЙГИРӢ · ТАЪРИХИ БЕ ТАҒЙИР',`
        <div class="panel" style="padding:13px;margin-bottom:14px"><form class="tracking-search" id="tracking-search"><input class="input mono" id="tracking-barcode" placeholder="Рақами штрихкодро ворид кунед" value="${esc(state.trackBarcode)}"><button class="btn btn-primary" type="submit">${icon('search',14)} Ҷустуҷӯ</button></form></div>
        ${product?passport(product):productNotFound()}`);
      $('#tracking-search').addEventListener('submit',async event=>{event.preventDefault();const value=$('#tracking-barcode').value.trim();if(!value){toast('Рақами штрихкодро ворид кунед.',true);return;}state.trackBarcode=value;await tracking();});
      $('#app-content').addEventListener('click',event=>{const button=event.target.closest('[data-track]');if(button)openTracking(button.dataset.track);});
      if(product)initScene($('#scene-mini'),product.config,'mini');
    }
    function productNotFound(){return `<div class="split"><section class="panel"><div class="panel-head"><div><div class="panel-title">Маҳсулоти феҳрист</div><div class="panel-kicker">Барои кушодани шиноснома маҳсулотро интихоб кунед</div></div></div><div class="table-wrap"><table><thead><tr><th>НОМ</th><th>ШТРИХКОД</th><th>БАСТА</th><th>МАРҲИЛА</th></tr></thead><tbody>${state.data.products.map(item=>`<tr><td><button class="product-link" data-track="${esc(item.barcode)}">${esc(item.name)}</button></td><td class="mono-id">${esc(item.barcode)}</td><td class="mono-id">${esc(item.batch_id)}</td><td><span class="status">${esc(stageName(item.current_stage))}</span></td></tr>`).join('')}</tbody></table></div></section><section class="panel"><div class="panel-head"><div><div class="panel-title">Таърихи боваринок</div><div class="panel-kicker">Ҳар рӯйдод бо пайванди криптографӣ ҳифз мешавад</div></div></div><div style="padding:18px"><div style="font-size:28px;font-weight:700">${state.data.products.length}</div><div class="panel-kicker">маҳсулот дар феҳристи занҷири таъминот</div></div></section></div>`;}
    function passport(product){return `<div class="track-layout"><section class="panel"><div class="passport-head"><div class="passport-info"><div class="product-glyph">${icon('package-check',19)}</div><div><div class="passport-title">${esc(product.name)}</div><div class="passport-meta mono">${esc(product.barcode)} · Баста ${esc(product.batch_id)}</div></div></div><span class="status ${product.current_stage==='transport'?'warn':''}">${esc(stageName(product.current_stage))}</span></div><div class="timeline">${product.events.map(event=>`<article class="event"><div class="event-marker">${icon(event.stage==='factory'?'factory':event.stage==='workshop'?'scan-search':event.stage==='warehouse'?'warehouse':'truck',10)}</div><div class="event-body"><div class="event-head"><div class="event-title">${esc(stageName(event.stage))} · №${event.sequence}</div><div class="event-time">${esc(new Date(event.timestamp).toLocaleString('tg-TJ',{dateStyle:'medium',timeStyle:'short'}))}</div></div><div class="event-location">${esc(event.location_name)} · ${esc(event.region)} · ${esc(event.city)}</div><div class="event-meta"><div class="meta-item">МАСЪУЛ<strong>${esc(event.responsible_name)} · ${esc(event.responsible_role)}</strong></div><div class="meta-item">САБТКУНАНДА<strong>${esc(event.operator_name)}</strong></div>${Object.entries(event.metadata||{}).filter(([key])=>key!=='config_version').map(([key,value])=>`<div class="meta-item">${esc(metaLabel(key).toUpperCase())}<strong>${esc(value)}</strong></div>`).join('')}<div class="meta-item">РАМЗИ САНҶИШ<strong class="mono">${esc(event.event_hash.slice(0,16))}…</strong></div></div></div></article>`).join('')}</div></section><aside><section class="panel"><div class="mini-scene" id="scene-mini"><div class="mini-label">ТАРҲИ НУСХАИ АСЛӢ · 3D</div></div><div style="padding:12px 14px;border-top:1px solid var(--line)"><div class="panel-title" style="font-size:11px">Версияи аввал: ${esc(product.config_version)}</div><div class="panel-kicker">Маркер · ${esc(product.config.length)} см · ғафсӣ ${esc(product.config.diameter)} мм · ${product.config.shape==='faceted'?'фасетдор':'даврашакл'}</div><div style="display:flex;gap:7px;margin-top:10px;align-items:center"><span class="swatch" style="background:${esc(product.config.color)}"></span><span class="hint">Корпус</span><span class="swatch" style="background:${esc(product.config.capColor)};margin-left:7px"></span><span class="hint">Сарпӯш</span></div></div></section><section class="panel section-gap"><div class="panel-head"><div><div class="panel-title">Маълумоти баста</div><div class="panel-kicker">Таърихи тағйироти конфигуратсия</div></div></div><div style="padding:13px 15px;display:grid;gap:10px"><div class="meta-item">ВАЗН<strong>${esc(product.weight)} кг</strong></div><div class="meta-item">СИФАТ<strong>${esc(product.qc_status)}</strong></div><div class="meta-item">ВЕРСИЯҲОИ ТАРҲ<strong>${product.revisions.length}</strong></div><div class="meta-item">ЭЗОҲ<strong>${esc(product.note||'—')}</strong></div>${product.revisions.map(revision=>`<div class="meta-item">ТАРҲИ ВЕРСИЯИ ${revision.version}<strong>${esc(revision.note)} · ${esc(revision.changed_by)}</strong></div>`).join('')}</div></section></aside></div>`;}
    function metaLabel(key){return({batch_weight_kg:'Вазни баста, кг',weight_kg:'Вазн, кг',quality:'Санҷиши сифат',note:'Эзоҳ',inspection:'Санҷиши дохилӣ',line:'Хати истеҳсол',adjustment:'Эзоҳи усто',shelf:'Рақами раф',sku:'Рақами мол',price_tjs:'Нарх, сомонӣ',temperature_c:'Ҳарорат, °C',package:'Ҳолати баста',vehicle:'Рақами мошин',driver:'Ронанда',driver_phone:'Телефони ронанда',brand:'Тамғаи мошин',route:'Масир',origin:'Аз куҷо',destination:'Ба куҷо',distance_km:'Масофа, км',eta_hours:'Вақти тахминӣ, соат',seal:'Рақами муҳр',cargo_state:'Ҳолати бор'}[key]||key.replaceAll('_',' '));}

    function mdm(){
      const resource=state.mdm;const fields=resourceFields[resource];
      const heads=fields.map(([,label])=>`<th>${esc(label.toUpperCase())}</th>`).join('');
      const rows=state.data[resource].map(record=>`<tr>${fields.map(([field])=>`<td>${field==='refrigerated'?record[field]?'Ҳаст':'Нест':field==='kind'?esc(locationKinds[record[field]]||record[field]):esc(record[field])}</td>`).join('')}</tr>`).join('');
      shell('Маълумотномаҳои умумӣ','Ҷойҳо, кормандон, нақлиёт ва масирҳо аз ҳамин ҷо идора мешаванд.','ИДОРАИ МАЪЛУМОТИ АСОСӢ',`
        <div class="mdm-nav">${Object.entries(resourceNames).map(([key,name])=>`<button class="tab-btn ${resource===key?'active':''}" data-mdm="${key}">${icon(({locations:'map-pin',staff:'users',vehicles:'truck',routes:'milestone'})[key],13)} ${name}<span class="mono" style="margin-left:5px;color:#839087">${state.data[key].length}</span></button>`).join('')}</div>
        <section class="panel"><div class="panel-head"><div><div class="panel-title">${resourceNames[resource]}</div><div class="panel-kicker">${state.data[resource].length} сабт · Дар рӯйхати амалиёт истифода мешавад</div></div><div class="mdm-actions"><input class="input search-small" id="mdm-search" placeholder="Ҷустуҷӯ..."><button class="btn btn-primary" id="add-record">${icon('plus',14)} Илова кардан</button></div></div><div class="table-wrap"><table><thead><tr>${heads}</tr></thead><tbody id="mdm-rows">${rows||`<tr><td colspan="${fields.length}" class="muted">Сабт нест</td></tr>`}</tbody></table></div></section><div class="hint" style="margin:12px 2px">Минтақаҳо: Душанбе · Суғд · Хатлон · ВМКБ</div>`);
      document.querySelectorAll('[data-mdm]').forEach(button=>button.addEventListener('click',()=>{state.mdm=button.dataset.mdm;mdm();}));
      $('#add-record').addEventListener('click',()=>openMdmModal(resource));
      $('#mdm-search').addEventListener('input',event=>{const query=event.target.value.toLocaleLowerCase('tg');$('#mdm-rows').querySelectorAll('tr').forEach(row=>row.classList.toggle('hidden',!row.textContent.toLocaleLowerCase('tg').includes(query)));});
    }
    function openMdmModal(resource){
      const fields=resourceFields[resource];
      const inputs=fields.map(([key,label])=>{
        if(resource==='locations'&&key==='kind')return `<div class="field"><label>${esc(label)}</label><select class="select" name="${key}" required><option value="factory">Корхона</option><option value="warehouse">Анбор</option><option value="pickup">Нуқтаи қабул</option></select></div>`;
        if(resource==='locations'&&key==='region')return `<div class="field"><label>${esc(label)}</label><select class="select" name="${key}" required><option>Душанбе</option><option>Суғд</option><option>Хатлон</option><option>ВМКБ</option></select></div>`;
        if(resource==='staff'&&key==='role')return `<div class="field"><label>${esc(label)}</label><select class="select" name="${key}" required>${['Роҳбари корхона','Устои сех','Анбордор','Қабулкунандаи бор','Логист','Ронанда','Оператори низом'].map(role=>`<option>${role}</option>`).join('')}</select></div>`;
        if(resource==='vehicles'&&key==='refrigerated')return `<div class="field"><label>${esc(label)}</label><select class="select" name="${key}"><option value="false">Нест</option><option value="true">Ҳаст</option></select></div>`;
        const numeric=['capacity','distance_km','duration_hours'].includes(key);const type=numeric?'number':'text';
        return `<div class="field"><label>${esc(label)}</label><input class="input" name="${key}" type="${type}" ${numeric?'min="0.1" step="0.1"':''} required></div>`;
      }).join('');
      $('#modal-root').innerHTML=`<div class="modal-backdrop" id="modal-backdrop"><form class="modal" id="mdm-form" role="dialog" aria-modal="true" aria-labelledby="modal-title"><div class="modal-head"><strong id="modal-title">Сабти нав · ${esc(resourceNames[resource])}</strong><button class="btn icon-btn btn-quiet" type="button" id="close-modal" aria-label="Пӯшидан">${icon('x',15)}</button></div><div class="modal-body"><div class="form-grid" style="padding:0">${inputs}</div></div><div class="modal-footer"><button class="btn btn-quiet" type="button" id="cancel-modal">Бекор кардан</button><button class="btn btn-primary" type="submit">${icon('save',14)} Нигоҳ доштан</button></div></form></div>`;
      refreshIcons();const close=()=>$('#modal-root').innerHTML='';$('#close-modal').addEventListener('click',close);$('#cancel-modal').addEventListener('click',close);$('#modal-backdrop').addEventListener('click',event=>{if(event.target.id==='modal-backdrop')close();});
      $('#mdm-form').addEventListener('submit',async event=>{event.preventDefault();const values=Object.fromEntries(new FormData(event.currentTarget));for(const key of ['capacity','distance_km','duration_hours'])if(values[key]!==undefined)values[key]=Number(values[key]);if(values.refrigerated!==undefined)values.refrigerated=values.refrigerated==='true';try{await api(`/mdm/${resource}`,{method:'POST',body:JSON.stringify(values)});close();await loadData();mdm();toast('Сабт ба маълумотнома илова шуд.');}catch(error){toast(error.message,true);}});
    }

    function createScene(container,config){
      const scene=new THREE.Scene();const camera=new THREE.PerspectiveCamera(36,1,.1,100);camera.position.set(4.7,3.8,6.8);
      const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;container.appendChild(renderer.domElement);
      scene.add(new THREE.HemisphereLight(0xdce9dd,0x344239,2.1));const key=new THREE.DirectionalLight(0xffefd7,3.3);key.position.set(4,7,5);key.castShadow=true;scene.add(key);const fill=new THREE.DirectionalLight(0x9ac4b0,1.5);fill.position.set(-5,2,-3);scene.add(fill);
      const floor=new THREE.Mesh(new THREE.CircleGeometry(3.1,64),new THREE.MeshStandardMaterial({color:0x29352d,roughness:.88}));floor.rotation.x=-Math.PI/2;floor.position.y=-1.05;floor.receiveShadow=true;scene.add(floor);const grid=new THREE.GridHelper(6,24,0x425147,0x344038);grid.position.y=-1.035;grid.material.transparent=true;grid.material.opacity=.35;scene.add(grid);
      const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.dampingFactor=.06;controls.minDistance=3;controls.maxDistance=12;controls.target.set(0,0,0);
      const context={scene,camera,renderer,controls,container,product:null,observer:null};updateScene(context,config);
      const resize=()=>{const rect=container.getBoundingClientRect();if(!rect.width||!rect.height)return;camera.aspect=rect.width/rect.height;camera.updateProjectionMatrix();renderer.setSize(rect.width,rect.height,false);};context.observer=new ResizeObserver(resize);context.observer.observe(container);resize();
      const animate=()=>{if(!container.isConnected){context.observer.disconnect();renderer.dispose();return;}requestAnimationFrame(animate);controls.update();renderer.render(scene,camera);};animate();return context;
    }
    function initScene(container,config,which){if(!container)return;if(which==='main'&&state.scene){state.scene.observer?.disconnect();state.scene.renderer.dispose();state.scene=null;}if(which==='mini'&&state.miniScene){state.miniScene.observer?.disconnect();state.miniScene.renderer.dispose();state.miniScene=null;}const scene=createScene(container,config);if(which==='main')state.scene=scene;else state.miniScene=scene;}
    function updateScene(context,config){
      if(!context)return;if(context.product){context.scene.remove(context.product);context.product.traverse(object=>{if(object.geometry)object.geometry.dispose();if(object.material){if(Array.isArray(object.material))object.material.forEach(material=>material.dispose());else object.material.dispose();}});}
      const group=new THREE.Group();const bodyColor=new THREE.Color(config.color||'#729c82');const capColor=new THREE.Color(config.capColor||'#d2a35e');const bodyMat=new THREE.MeshStandardMaterial({color:bodyColor,roughness:.31,metalness:.1,flatShading:config.shape==='faceted'});const capMat=new THREE.MeshStandardMaterial({color:capColor,roughness:.34});const metalMat=new THREE.MeshStandardMaterial({color:0xb5b7a9,metalness:.8,roughness:.22});const nibMat=new THREE.MeshStandardMaterial({color:0x252422,roughness:.65});const innerMat=new THREE.MeshStandardMaterial({color:0xe9e5d6,roughness:.8});
      const segments=config.shape==='faceted'?8:48;const length=THREE.MathUtils.clamp(Number(config.length)||12,8,16)/10;const radius=THREE.MathUtils.clamp(Number(config.diameter)||1.8,1.2,2.8)/20;const bodyLength=length*.72;const tipLength=length*.17;const capLength=length*.23;const top=bodyLength/2;
      const mesh=(geometry,material,y)=>{const object=new THREE.Mesh(geometry,material);object.position.y=y;object.castShadow=true;object.receiveShadow=true;group.add(object);return object;};
      mesh(new THREE.CylinderGeometry(radius*.96,radius,bodyLength,segments,1),bodyMat,0);
      mesh(new THREE.CylinderGeometry(radius*.97,radius*.98,.045,segments),metalMat,top-.012);
      mesh(new THREE.CylinderGeometry(radius*1.03,radius*1.03,capLength,segments,1),capMat,top+capLength/2-.012);
      const clip=new THREE.Mesh(new THREE.BoxGeometry(radius*.3,capLength*.76,radius*.15),capMat);clip.position.set(radius*.83,top+capLength*.56,0);clip.castShadow=true;group.add(clip);
      const nibBase=-bodyLength/2;mesh(new THREE.CylinderGeometry(radius*.7,radius*.8,.055,segments),metalMat,nibBase+.012);
      const nib=mesh(new THREE.ConeGeometry(radius*.72,tipLength,segments),innerMat,nibBase-tipLength/2+.015);nib.rotation.z=Math.PI;
      const core=mesh(new THREE.ConeGeometry(radius*.25,tipLength*.57,segments),nibMat,nibBase-tipLength*.6);core.rotation.z=Math.PI;
      group.rotation.z=-.12;context.scene.add(group);context.product=group;
    }

    async function loadData(){state.data=await api('/bootstrap');}
    function navActive(){document.querySelectorAll('.nav-btn').forEach(button=>button.classList.toggle('active',button.dataset.view===state.view));}
    async function navigate(view){state.view=view;state.trackBarcode='';navActive();if(view==='dashboard')dashboard();if(view==='logistics')logistics();if(view==='tracking')await tracking();if(view==='mdm')mdm();}
    async function openTracking(value){state.trackBarcode=value;state.view='tracking';navActive();await tracking();}
    document.querySelectorAll('.nav-btn').forEach(button=>button.addEventListener('click',()=>navigate(button.dataset.view)));
    $('#today').textContent=new Date().toLocaleString('tg-TJ',{dateStyle:'medium'});
    try{await loadData();dashboard();}catch(error){$('#app-content').innerHTML=`<section class="panel" style="padding:24px"><div class="panel-title">Ба феҳрист пайваст нашуд</div><p class="hint">${esc(error.message)}. Барномаро бо uvicorn app:app --reload оғоз кунед.</p><button class="btn" onclick="location.reload()">Аз нав бор кардан</button></section>`;}
  </script>
</body>
